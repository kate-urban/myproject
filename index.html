<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus — Редактор документов</title>
    <link rel="stylesheet" href="/static/css/shell.css?v=20260714c">
    <script src="/static/js/ui_ru.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/edit_lock.js"></script>
    <script src="/static/js/shell.js?v=20260714"></script>
    <script src="/static/js/embed_mode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js"></script>

    <link rel="stylesheet" href="/static/css/editor-page.css?v=20260710b">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <a class="app-brand" href="/">
                <div class="app-logo" id="appHeaderLogo">S</div>
                <div>
                    <h1 id="appHeaderTitle">Syllabus</h1>
                    <div class="subtitle" id="appHeaderSubtitle"></div>
                </div>
            </a>
            <span class="header-context" id="appHeaderContext"></span>
            <span class="header-extra" id="appHeaderExtra">
                <span class="doc-chip" id="doc-name" title="Текущий документ">Без документа</span>
            </span>
            <div class="header-actions" id="appHeaderActions">
                <span class="user-chip hidden" id="headerUser"></span>
            </div>
            <nav class="header-nav" id="appHeaderNav"></nav>
            <button type="button" class="btn-header hidden" id="btnHeaderLogout">Выход</button>
        </header>

        <div id="appRibbon" class="app-ribbon"></div>

        <div class="subtoolbar">
            <span class="subtoolbar-label">Шаблон экспорта</span>
            <select class="tool-select" id="template-select" title="Шаблон для экспорта в Word" onchange="onTemplateChange()">
                <option value="">Загрузка…</option>
            </select>
            <button class="btn sm" id="refresh-templates-btn" type="button" onclick="fetchTemplates()" title="Обновить список">Обновить</button>
            <span class="tool-link" onclick="document.getElementById('template-input').click()" title="Добавить .docx в каталог">+ шаблон</span>
        </div>

        <div class="sr-only" aria-hidden="true">
            <input type="file" id="file-input" accept=".pdf,.docx">
            <input type="file" id="template-input" accept=".docx">
        </div>

        <div class="workspace-main">
            <aside class="sidebar app-sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-title">Разделы документа</div>
                    <div class="sidebar-meta">Всего: <strong id="sections-count">0</strong></div>
                    <input type="search" class="section-search" id="sectionSearch" placeholder="Поиск раздела…">
                </div>
                <div class="sidebar-content" id="sections-list">
                    <div class="empty-state">
                        <p>Откройте .docx или .pdf кнопкой «Открыть» на ленте</p>
                    </div>
                </div>
            </aside>

            <div class="editor-area">
                <div class="editor-container">
                    <div class="editor-page">
                        <div class="editor-page-header" id="section-title">Выберите раздел для редактирования</div>
                        <div class="editor-body">
                            <textarea id="editor"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="statusbar">
            <span class="status-dot"></span>
            <span id="status-text">Готово</span>
            <div class="statusbar-spacer"></div>
            <span>База данных</span>
        </footer>
    </div>
    <div class="toast-container" id="toast-container"></div>

    <script>
        // ===== Global State =====
        const state = {
            docId: null,
            programId: null,
            docName: '',
            docType: '',
            sections: [],
            selectedSectionId: null,
            pendingSectionId: null,
            sectionContent: '',
            templates: [],
            selectedTemplate: '',
            collapsedNodes: new Set(),
        };

        let editorReady = false;
        const API = `${window.location.origin}/api/v1`;

        function authFetch(url, opts = {}) {
            const headers = SyllabusAuth.authHeaders({ ...(opts.headers || {}) });
            return fetch(url, { ...opts, headers });
        }

        function refreshEditorRibbon() {
            SyllabusShell.initPage('editor', {
                docId: state.docId,
                programId: state.programId,
                onOpenFile: () => document.getElementById('file-input').click(),
                onSave: () => handleSaveSection(),
                onExport: () => handleExport(),
            });
            const exportBtn = document.getElementById('rbExportDoc');
            if (exportBtn) exportBtn.disabled = !state.docId || !state.selectedTemplate;
        }

        // ===== Initialize TinyMCE =====
        document.addEventListener('DOMContentLoaded', async () => {
            if (!(await SyllabusAuth.requireAuth('/'))) return;
            tinymce.init({
                selector: '#editor',
                height: 600,
                menubar: false,
                ...(window.SyllabusUiRu?.tinymceLanguage || {}),
                plugins: [
                    'advlist', 'autolink', 'lists', 'link', 'image', 'charmap', 'preview',
                    'anchor', 'searchreplace', 'visualblocks', 'code', 'fullscreen',
                    'insertdatetime', 'media', 'table', 'help', 'wordcount'
                ],
                toolbar: 'undo redo | blocks | ' +
                    'bold italic forecolor | alignleft aligncenter ' +
                    'alignright alignjustify | bullist numlist outdent indent | ' +
                    'table | removeformat | code | help',
                content_style: 'body { font-family: "Calibri", "Segoe UI", Arial, sans-serif; font-size: 14px; line-height: 1.6; padding: 20px; } ' +
                    'table { border-collapse: collapse; width: 100%; margin: 15px 0; } ' +
                    'table td, table th { border: 1px solid #999; padding: 8px 10px; } ' +
                    'table th { background: #f0f0f0; font-weight: 600; }',
                table_sizing_mode: 'relative',
                table_use_colgroups: true,
                table_header_type: 'section',
                table_default_attributes: { border: '1' },
                table_default_styles: { 'border-collapse': 'collapse', width: '100%' },
                table_toolbar: 'tableprops tabledelete | tableinsertrowbefore tableinsertrowafter tabledeleterow | tableinsertcolbefore tableinsertcolafter tabledeletecol',
                setup: (editor) => {
                    editor.on('init', () => {
                        editorReady = true;
                        if (state.pendingSectionId) {
                            selectSection(state.pendingSectionId);
                            state.pendingSectionId = null;
                        }
                    });
                    editor.on('change', () => {
                        state.sectionContent = editor.getContent();
                    });
                    editor.on('keyup', () => {
                        state.sectionContent = editor.getContent();
                    });
                }
            });

            // File input handler
            document.getElementById('file-input').addEventListener('change', (e) => {
                if (e.target.files[0]) handleUpload();
            });

            document.getElementById('template-input').addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    handleTemplateUpload(e.target.files[0]);
                    e.target.value = '';
                }
            });

            document.getElementById('sectionSearch')?.addEventListener('input', () => renderSections());

            // Load templates
            fetchTemplates();
            refreshEditorRibbon();

            const urlDoc = new URLSearchParams(location.search).get('doc');
            if (urlDoc) openDocumentById(urlDoc).catch(e => showToast(e.message, 'error'));
        });

        // ===== Toast =====
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // ===== Fetch Templates =====
        function onTemplateChange() {
            const select = document.getElementById('template-select');
            state.selectedTemplate = select.value || '';
            updateExportState();
        }

        function autoPickTemplate(docType, filename) {
            const select = document.getElementById('template-select');
            if (!state.templates.length) return false;

            const nameUpper = (filename || '').toUpperCase();
            const isFos = docType === 'fos' || nameUpper.startsWith('FOS_');
            const keyword = isFos ? 'ФОС' : 'РПД';

            let match = state.templates.find(t => t.name.toUpperCase().includes(keyword));
            if (!match) match = state.templates[0];

            select.value = match.id;
            state.selectedTemplate = match.id;
            updateExportState();
            return true;
        }

        function updateExportState() {
            const select = document.getElementById('template-select');
            const templateId = select.value || '';
            state.selectedTemplate = templateId;
            refreshEditorRibbon();

            const tpl = state.templates.find(t => t.id === templateId);
            if (state.docId && tpl) {
                document.getElementById('status-text').textContent =
                    `Готово к экспорту: ${tpl.name}`;
            } else if (state.docId) {
                document.getElementById('status-text').textContent =
                    'Выберите шаблон в списке «Шаблон:»';
            }
        }

        async function fetchTemplates() {
            const select = document.getElementById('template-select');
            const refreshBtn = document.getElementById('refresh-templates-btn');
            const previousId = state.selectedTemplate || select.value;
            select.disabled = true;
            if (refreshBtn) refreshBtn.disabled = true;
            select.innerHTML = '<option value="">Загрузка...</option>';

            try {
                const res = await authFetch(`${API}/templates/`);
                if (!res.ok) throw new Error(await readApiError(res));
                const data = await res.json();
                state.templates = data;
                select.innerHTML = '<option value="">— выберите шаблон —</option>';
                if (data.length === 0) {
                    select.innerHTML = '<option value="">Нет шаблонов (папка «Макеты»)</option>';
                    showToast('Шаблоны не найдены. Положите файлы в папку «Макеты» и нажмите «Обновить»', 'error');
                } else {
                    data.forEach(t => {
                        const option = document.createElement('option');
                        option.value = t.id;
                        option.textContent = t.name;
                        select.appendChild(option);
                    });
                }

                if (previousId && data.some(t => t.id === previousId)) {
                    select.value = previousId;
                    state.selectedTemplate = previousId;
                } else if (state.docId) {
                    autoPickTemplate(state.docType, state.docName);
                }
                updateExportState();
            } catch (e) {
                console.error('Ошибка загрузки шаблонов:', e);
                select.innerHTML = '<option value="">Ошибка загрузки</option>';
                showToast('Не удалось загрузить шаблоны: ' + e.message, 'error');
            } finally {
                select.disabled = false;
                if (refreshBtn) refreshBtn.disabled = false;
                updateExportState();
            }
        }

        async function handleTemplateUpload(file) {
            if (!file.name.toLowerCase().endsWith('.docx')) {
                return showToast('Шаблон должен быть в формате DOCX', 'error');
            }
            const formData = new FormData();
            formData.append('file', file);
            formData.append('name', file.name.replace(/\.docx$/i, ''));
            try {
                const res = await authFetch(`${API}/templates/`, { method: 'POST', body: formData });
                if (!res.ok) throw new Error(await readApiError(res));
                const uploaded = await res.json();
                showToast(`Шаблон «${uploaded.name}» добавлен в каталог`);
                state.selectedTemplate = uploaded.id;
                await fetchTemplates();
                document.getElementById('template-select').value = uploaded.id;
                state.selectedTemplate = uploaded.id;
                updateExportState();
            } catch (e) {
                showToast('Ошибка загрузки шаблона: ' + e.message, 'error');
            }
        }

        async function openDocumentById(docId) {
            if (window.SyllabusEditLock) {
                await SyllabusEditLock.release();
            }

            document.getElementById('status-text').textContent = 'Загрузка документа...';
            const res = await authFetch(`${API}/documents/${docId}/`);
            if (!res.ok) throw new Error(await readApiError(res));
            const data = await res.json();

            if (data.program_link?.program_id && window.SyllabusEditLock) {
                try {
                    await SyllabusEditLock.acquire(data.program_link.program_id);
                } catch (err) {
                    showToast(err.message, 'error');
                    document.getElementById('status-text').textContent = `Занято: ${err.message}`;
                    return;
                }
            }

            state.docId = data.id;
            state.programId = data.program_link?.program_id || null;
            state.docName = data.filename;
            state.docType = data.doc_type || '';
            state.sections = data.sections || [];
            state.collapsedNodes.clear();

            document.getElementById('status-text').textContent =
                state.programId ? `Редактирование: ${data.filename}` : 'Готово';

            document.getElementById('doc-name').textContent = data.filename;
            document.getElementById('doc-name').title = data.filename;
            document.getElementById('sections-count').textContent = state.sections.length;
            const search = document.getElementById('sectionSearch');
            if (search) search.value = '';

            renderSections();
            if (state.sections.length > 0) {
                const first = state.sections.find(s => s.content && s.content.trim()) || state.sections[0];
                selectSection(first.id);
            }
            if (!autoPickTemplate(state.docType, state.docName)) {
                updateExportState();
            }
            if (!state.programId) {
                document.getElementById('status-text').textContent = 'Готово';
            }
            refreshEditorRibbon();
        }

        window.addEventListener('pagehide', () => {
            if (window.SyllabusEditLock) SyllabusEditLock.release();
        });

        // ===== Upload Document =====
        function parseApiError(body, status) {
            if (!body) return `Ошибка сервера (${status})`;
            if (typeof body.detail === 'string') return body.detail;
            if (Array.isArray(body.detail)) {
                return body.detail.map(d => d.msg || JSON.stringify(d)).join('; ');
            }
            if (typeof body.message === 'string') return body.message;
            return `Ошибка сервера (${status})`;
        }

        async function readApiError(res) {
            const text = await res.text();
            try {
                return parseApiError(JSON.parse(text), res.status);
            } catch {
                return text.trim().slice(0, 200) || `Ошибка сервера (${res.status})`;
            }
        }

        async function handleUpload() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) return showToast('Выберите файл', 'error');

            const ext = file.name.split('.').pop().toLowerCase();
            if (!['pdf', 'docx'].includes(ext)) {
                return showToast('Поддерживаются только PDF и DOCX', 'error');
            }

            document.getElementById('status-text').textContent = 'Загрузка...';
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await authFetch(`${API}/upload/`, { method: 'POST', body: formData });
                if (!res.ok) throw new Error(await readApiError(res));
                const data = await res.json();
                
                state.docId = data.id;
                state.programId = data.program_link?.program_id || null;
                state.docName = data.filename;
                state.docType = data.doc_type || '';
                state.sections = data.sections;
                state.collapsedNodes.clear();
                
                document.getElementById('doc-name').textContent = data.filename;
                document.getElementById('doc-name').title = data.filename;
                document.getElementById('sections-count').textContent = data.sections.length;
                const search = document.getElementById('sectionSearch');
                if (search) search.value = '';
                
                renderSections();
                
                if (data.sections.length > 0) {
                    const first = data.sections.find(s => s.content && s.content.trim()) || data.sections[0];
                    selectSection(first.id);
                }

                if (!autoPickTemplate(state.docType, state.docName)) {
                    updateExportState();
                }
                showToast(`Документ «${data.filename}» загружен`);
                refreshEditorRibbon();
            } catch (e) {
                showToast('Ошибка: ' + e.message, 'error');
            } finally {
                if (!state.docId || !document.getElementById('template-select').value) {
                    document.getElementById('status-text').textContent = 'Готово';
                }
            }
        }

        // ===== Render Sections (tree) =====
        function buildSectionTree(sections) {
            const byParent = new Map();
            sections.forEach(s => {
                const key = s.parent_id || 'root';
                if (!byParent.has(key)) byParent.set(key, []);
                byParent.get(key).push(s);
            });
            byParent.forEach(list => list.sort((a, b) => a.order_index - b.order_index));
            return byParent;
        }

        function renderTreeNode(section, byParent, container) {
            const children = byParent.get(section.id) || [];
            const hasChildren = children.length > 0;
            const isCollapsed = state.collapsedNodes.has(section.id);
            const isActive = state.selectedSectionId === section.id;
            const isEmpty = !section.content || !section.content.trim();

            const item = document.createElement('div');
            item.className = `tree-item level-${section.level || 1}${hasChildren ? ' has-children' : ''}${isActive ? ' active' : ''}`;

            if (hasChildren) {
                const toggle = document.createElement('span');
                toggle.className = 'tree-toggle';
                toggle.textContent = isCollapsed ? '▶' : '▼';
                toggle.onclick = (e) => {
                    e.stopPropagation();
                    if (state.collapsedNodes.has(section.id)) {
                        state.collapsedNodes.delete(section.id);
                    } else {
                        state.collapsedNodes.add(section.id);
                    }
                    renderSections();
                };
                item.appendChild(toggle);
            } else {
                const spacer = document.createElement('span');
                spacer.className = 'tree-toggle';
                spacer.textContent = '';
                item.appendChild(spacer);
            }

            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = section.section_name;
            if (isEmpty && hasChildren) {
                const note = document.createElement('span');
                note.className = 'tree-empty-note';
                note.textContent = ' (заголовок)';
                label.appendChild(note);
            }
            item.appendChild(label);

            item.onclick = () => selectSection(section.id);
            container.appendChild(item);

            if (hasChildren) {
                const childWrap = document.createElement('div');
                childWrap.className = `tree-children${isCollapsed ? ' collapsed' : ''}`;
                children.forEach(child => renderTreeNode(child, byParent, childWrap));
                container.appendChild(childWrap);
            }
        }

        function sectionSearchQuery() {
            return (document.getElementById('sectionSearch')?.value || '').trim().toLowerCase();
        }

        function sectionsForDisplay() {
            const q = sectionSearchQuery();
            if (!q) return state.sections;
            return state.sections.filter(s =>
                String(s.section_name || '').toLowerCase().includes(q)
            );
        }

        function renderSections() {
            const list = document.getElementById('sections-list');
            if (state.sections.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <p>Откройте .docx или .pdf кнопкой «Открыть» на ленте</p>
                    </div>`;
                return;
            }

            const visible = sectionsForDisplay();
            if (!visible.length) {
                list.innerHTML = '<div class="empty-state"><p>Разделы не найдены</p></div>';
                return;
            }

            list.innerHTML = '';
            const q = sectionSearchQuery();
            if (q) {
                visible.forEach(section => {
                    const item = document.createElement('div');
                    item.className = `tree-item level-${section.level || 1}${state.selectedSectionId === section.id ? ' active' : ''}`;
                    const spacer = document.createElement('span');
                    spacer.className = 'tree-toggle';
                    const label = document.createElement('span');
                    label.className = 'tree-label';
                    label.textContent = section.section_name;
                    item.appendChild(spacer);
                    item.appendChild(label);
                    item.onclick = () => selectSection(section.id);
                    list.appendChild(item);
                });
                return;
            }

            const byParent = buildSectionTree(state.sections);
            const roots = byParent.get('root') || [];
            roots.forEach(section => renderTreeNode(section, byParent, list));
        }

        // ===== Select Section =====
        function flushEditorToState() {
            if (!state.selectedSectionId) return;
            const editor = tinymce.get('editor');
            const content = editor ? editor.getContent() : state.sectionContent;
            const section = state.sections.find(s => s.id === state.selectedSectionId);
            if (section) section.content = content;
        }

        function buildExportPayload() {
            flushEditorToState();
            return {
                sections: state.sections.map(s => ({
                    id: s.id,
                    content: s.content || '',
                })),
            };
        }

        function ensureHtml(content) {
            if (!content) return '';
            if (/<[a-z][\s\S]*>/i.test(content)) return content;
            return content
                .split(/\n\s*\n/)
                .filter(p => p.trim())
                .map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function selectSection(id) {
            if (state.selectedSectionId && state.selectedSectionId !== id) {
                flushEditorToState();
            }
            state.selectedSectionId = id;
            const section = state.sections.find(s => s.id === id);
            if (!section) return;

            if (!editorReady) {
                state.pendingSectionId = id;
                document.getElementById('section-title').textContent = section.section_name;
                renderSections();
                return;
            }

            state.sectionContent = section.content;
            const editor = tinymce.get('editor');
            if (editor) {
                editor.setContent(ensureHtml(section.content || ''));
            }
            document.getElementById('section-title').textContent = section.section_name;
            renderSections();
        }

        // ===== Save Section =====
        async function handleSaveSection() {
            if (!state.selectedSectionId) return;

            flushEditorToState();
            document.getElementById('status-text').textContent = 'Сохранение...';
            try {
                const section = state.sections.find(s => s.id === state.selectedSectionId);
                const content = section ? section.content : state.sectionContent;
                
                const res = await authFetch(`${API}/sections/${state.selectedSectionId}/`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content }),
                });
                if (res.ok) {
                    const updated = state.sections.find(s => s.id === state.selectedSectionId);
                    if (updated) updated.content = content;
                    showToast('Сохранено!');
                } else {
                    throw new Error(await readApiError(res));
                }
            } catch (e) {
                showToast('Ошибка: ' + e.message, 'error');
            } finally {
                document.getElementById('status-text').textContent = 'Готово';
            }
        }

        async function persistAllSectionsForExport() {
            flushEditorToState();
            await Promise.all(
                state.sections.map(s =>
                    authFetch(`${API}/sections/${s.id}/`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: s.content || '' }),
                    })
                )
            );
        }

        async function requestExport(url, payload) {
            let res = await authFetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            // Старый сервер без POST /export/ — используем GET после сохранения разделов
            if (res.status === 405) {
                res = await authFetch(url);
            }
            return res;
        }

        // ===== Export =====
        async function handleExport() {
            const templateId = document.getElementById('template-select').value;
            if (!state.docId) {
                return showToast('Сначала откройте документ (кнопка «Открыть» на ленте)', 'error');
            }
            if (!templateId) {
                return showToast('Выберите шаблон в списке «Шаблон:»', 'error');
            }

            document.getElementById('status-text').textContent = 'Сохранение и экспорт...';
            const exportBtn = document.getElementById('rbExportDoc');
            if (exportBtn) exportBtn.disabled = true;

            try {
                await persistAllSectionsForExport();
                const url = `${API}/export/${state.docId}/?template_id=${encodeURIComponent(templateId)}`;
                const res = await requestExport(url, buildExportPayload());
                if (!res.ok) throw new Error(await readApiError(res));

                const injected = res.headers.get('X-Sections-Injected');
                const total = res.headers.get('X-Sections-Total');
                const mode = res.headers.get('X-Export-Mode');

                const blob = await res.blob();
                const objectUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = objectUrl;
                const safeName = (state.docName || 'document').replace(/[<>:"/\\|?*]+/g, '_');
                link.download = safeName.toLowerCase().endsWith('.docx') ? safeName : `${safeName}.docx`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(objectUrl);
                const note = injected && total
                    ? (mode === 'assemble'
                        ? `Скачан документ: шапка макета + ${injected} разделов вашего файла`
                        : `Скачан файл (в шаблон подставлено ${injected} из ${total} разделов)`)
                    : 'Файл скачан';
                showToast(note);
            } catch (e) {
                showToast('Ошибка экспорта: ' + e.message, 'error');
            } finally {
                updateExportState();
            }
        }
    </script>
</body>
</html>
