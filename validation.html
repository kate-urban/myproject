<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus — сверка УП ↔ РПД ↔ ФОС</title>
  <link rel="stylesheet" href="/static/css/shell.css?v=20260714c">
  <script src="/static/js/ui_ru.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/api_utils.js?v=20260709s"></script>
  <script src="/static/js/shell.js?v=20260714"></script>
  <script src="/static/js/embed_mode.js"></script>
  <script src="/static/js/plans_folder_tree.js"></script>
  <script src="/static/js/edit_lock.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js"></script>
  <link rel="stylesheet" href="/static/css/validation-page.css?v=20260714">
</head>
<body>
  <header class="app-header">
    <a class="app-brand" href="/">
      <div class="app-logo" id="appHeaderLogo">S</div>
      <div>
        <h1 id="appHeaderTitle">Syllabus</h1>
        <div class="subtitle" id="appHeaderSubtitle"></div>
      </div>
    </a>
    <span class="header-context" id="appHeaderContext"></span>
    <span class="header-extra" id="appHeaderExtra"></span>
    <div class="header-actions" id="appHeaderActions">
      <span class="user-chip hidden" id="headerUser"></span>
    </div>
    <nav class="header-nav" id="appHeaderNav"></nav>
    <button type="button" class="btn-header hidden" id="btnHeaderLogout">Выход</button>
  </header>

  <div class="layout app-layout">
    <aside class="sidebar app-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Учебные планы</div>
        <input type="search" class="search-input" id="planSearch" placeholder="Поиск по папке, коду, профилю…">
      </div>
      <div class="plan-list" id="planList"></div>
    </aside>

    <div class="main-col">
      <div id="appRibbon" class="app-ribbon"></div>
      <main id="main" class="page-main">
        <div id="errorPanel" class="error-panel"></div>
        <div class="empty-state page-empty">
          <h2>Выберите учебный план</h2>
          <p>Импортируйте УП кнопкой «Импорт УП» на ленте или выберите план из списка слева.</p>
        </div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="sr-only" aria-hidden="true">
    <input type="file" id="importPlx" accept=".plx,.xlsx,.xlsm">
    <input type="file" id="uploadFolder" accept=".doc,.docx" webkitdirectory>
    <input type="file" id="uploadRpd" accept=".doc,.docx">
    <input type="file" id="uploadFos" accept=".doc,.docx">
  </div>

  <div class="doc-modal" id="docEditorModal" aria-hidden="true">
    <div class="doc-modal-inner">
      <div class="doc-modal-header">
        <h3 id="docEditorTitle">Документ</h3>
        <div class="doc-mode-tabs">
          <button type="button" class="doc-mode-tab active" id="docTabSections">Разделы</button>
          <button type="button" class="doc-mode-tab hidden" id="docTabStructured">Структура</button>
        </div>
        <div class="doc-modal-actions">
          <button class="btn" id="docEditorFocus" type="button" title="Свернуть боковые панели">На весь экран</button>
          <button class="btn primary" id="docEditorSave" type="button" title="Сохранить текущий раздел">Сохранить</button>
          <button class="btn" id="docEditorRevalidate" type="button">Сверка</button>
          <button class="btn" id="docEditorExportDocx" type="button" title="Сохранить и скачать DOCX по макету">DOCX</button>
          <button class="btn" id="docEditorExportPdf" type="button" title="PDF для печати">PDF</button>
          <button class="btn ghost" id="docEditorClose" type="button">Закрыть</button>
        </div>
      </div>
      <div class="doc-issues empty" id="docEditorIssues">
        <div class="doc-issues-head" id="docIssuesHead">
          <h4 id="docIssuesTitle">Ошибки сверки</h4>
          <button type="button" class="doc-panel-toggle" id="docIssuesToggle" title="Свернуть или развернуть">Свернуть</button>
        </div>
        <div class="doc-issues-body" id="docEditorIssuesBody"></div>
      </div>
      <div class="doc-modal-body" id="docEditorBody">
        <aside class="doc-sections">
          <div class="doc-sections-head">
            <span>Разделы</span>
            <button type="button" class="doc-panel-toggle" id="docSectionsToggle" title="Свернуть список разделов">Свернуть</button>
          </div>
          <div class="doc-sections-list" id="docEditorSections"></div>
        </aside>
        <div class="doc-editor-main">
          <div class="doc-editor-title" id="docEditorSectionTitle">Выберите раздел</div>
          <div class="doc-rule-hint" id="docEditorRuleHint"></div>
          <div class="doc-editor-wrap">
            <div class="doc-editor-page">
              <textarea id="docEditor"></textarea>
            </div>
          </div>
        </div>
        <aside class="doc-assistant" id="docAssistant" aria-hidden="false">
          <div class="doc-assistant-head">
            <span>ИИ-помощник</span>
            <span class="doc-assistant-badge" id="docAssistantBadge" title="Режим ответа"></span>
            <button type="button" class="doc-panel-toggle" id="docAssistantToggle" title="Свернуть панель">Свернуть</button>
          </div>
          <div class="doc-assistant-body">
            <div class="doc-assistant-context" id="docAssistantContext">Выберите ошибку сверки — помощник подскажет, где править.</div>
            <div class="doc-assistant-quick">
              <button type="button" class="btn sm" data-assist-prompt="explain">Объяснить ошибку</button>
              <button type="button" class="btn sm" data-assist-prompt="where">Где править?</button>
              <button type="button" class="btn sm" data-assist-prompt="steps">Шаги исправления</button>
            </div>
            <div class="doc-assistant-messages" id="docAssistantMessages"></div>
            <form class="doc-assistant-form" id="docAssistantForm">
              <textarea id="docAssistantInput" rows="2" placeholder="Спросите про ошибку сверки…"></textarea>
              <button type="submit" class="btn primary sm" id="docAssistantSend">Отправить</button>
            </form>
          </div>
        </aside>
      </div>
      <div id="docStructuredPanel" class="doc-structured-panel hidden">
        <aside class="doc-structured-sidebar">
          <button type="button" class="struct-tab active" data-struct="topics">Темы</button>
          <button type="button" class="struct-tab" data-struct="zuv">ЗУВ</button>
          <button type="button" class="struct-tab" data-struct="literature">Литература</button>
        </aside>
        <div class="doc-structured-main">
          <div class="struct-toolbar">
            <button type="button" class="btn sm" id="structAddRow">Строка</button>
            <button type="button" class="btn sm" id="structRefreshFromDoc">Из документа</button>
            <button type="button" class="btn sm primary" id="structApplyToDoc">В документ</button>
          </div>
          <div id="structEditorHost" class="struct-editor-host"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/validation_rules.js?v=20260713g"></script>
  <script src="/static/js/validation_assistant.js?v=20260713f"></script>
  <script src="/static/js/validation_fix.js?v=20260713e"></script>
  <script src="/static/js/validation_page.js?v=20260714s2"></script>
  <script src="/static/js/validation_editor.js?v=20260714s2"></script>
  <script src="/static/js/validation_structured.js"></script>
</body>
</html>
