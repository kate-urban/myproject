# --- Правила имён файлов ---

filename_rules:
  rpd: "{code_lat}_{translit_name}_k{dept}.docx"
  fos: "FOS_{code_lat}_{translit_name}_k{dept}.docx"
  ftd: "FTD_{num}_{translit_name}_k{dept}.docx"
  code_normalization:
    cyrillic_to_latin: { "Б": "B", "О": "O", "В": "V", "П": "P" }
    dot_to_underscore: true
    parentheses: "(П) → _P"
  dept_suffix: "k{NN} = код кафедры из справочника (45, 51, 55, …)"
  examples:
    - code: "Б1.О.01.07"
      file_part: "B1_O_01_07"
      sample: B1_O_01_07_Proektnaya_deyatelnost_k55.docx
    - code: "Б2.О.03(П)"
      file_part: "B2_O_03_P"
      sample: B2_O_03_P_Proizvodstvennaya_praktika_Proektnaya_praktika_k55.docx

